# =============================================================================
# Research story: the timeline at the top of the Research tab.
#
# The story is a sequence of beats along one timeline. Each beat draws the line further
# (to `reach`), shows its items as large boxes above the line, and its narration below.
# Items from earlier beats shrink into a small pile where they happened.
# Add ?draft to the page URL to see empty narration outlined while writing.
#
#   ticks:         years marked on the line (each appears once the line reaches it)
#   beats:
#     reach:       how far (in years) the line has drawn by this beat
#     text:        narration under this beat's items (HTML allowed); "" hides it
#                  wrap words in <u>...</u> for a hand-drawn underline, e.g.
#                    text: "Engineers were right to be <u>reluctant</u> about learned systems"
#     stances:     stances written into the list above the timeline as this beat opens
#                  (quote each one, e.g. ["first, with a comma", "second"]; unquoted,
#                  a comma splits a stance in two)
#     crossouts:   earlier stances struck through at this beat, by their exact text or
#                  their number in the list (1 = the first stance ever taken)
#                  To write a note beside the strike, give it as {stance: 3, note: "..."}
#                  (stance by number or by its quoted text), e.g.
#                    crossouts: [{stance: 1, note: "only half right"}]
#     edits:       strike a word or phrase inside an earlier stance and write beside it, e.g.
#                    edits: [{stance: 2, word: "future", write: "present"}]
#                  (stance by number or quoted text; `write` is optional). A later beat can
#                  edit again, even striking what an earlier edit wrote.
#                  To add without striking anything, leave out `word`: the writing goes at
#                  the end of the stance, or right after `after`, e.g.
#                    edits: [{stance: 4, write: "(and from themselves)"},
#                            {stance: 1, after: "problems", write: "worth solving"}]
#     revives:     bring back what was struck: a whole stance by number or quoted text, or one
#                  word or phrase, e.g. revives: [3] or revives: [{stance: 3, word: "planning"}]
#     layout:      "thirds" centres the beat's cards on the rule-of-thirds lines instead of
#                  on their dates (two cards: one third and two thirds across)
#     items:       the boxes this beat introduces
#       label:     handwritten label above the box ("" for none)
#       date:      where on the line it sits, as a decimal year (2021.5 = mid-2021)
#       size:      box size relative to the others (default 1)
#       aspect:    card width / height (default 1.33 = 4:3); e.g. 0.5625 for a portrait phone video
#       images:    pictures in the box; several are shown together as overlapping cards
#         src:     path under /images; .mp4/.webm videos play muted on a loop, like a GIF
#         pos:     which part of the picture to keep when cropping (CSS object-position)
#         fit:     "contain" shows the whole picture instead of cropping it (for diagrams)
#         caption: shown on the back when the picture is clicked (HTML allowed); pictures
#                  without one don't turn over
#
#   title:         heading over the stance list
#   title_crossouts (per beat): words of the title struck out at that beat, e.g. ["Unshakeable"]
# =============================================================================

# Animation speed: `speed` is the default (a number, or "off"); viewers can pick any of
# `speeds` in the corner, turn animations off, or skip to the end.
speed: 1
speeds: [1, 2]

title: "My Beliefs"

ticks: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]

beats:
  - reach: 2021.9
    layout: thirds
    text: "Before all the AI, I was first a (student) engineer with an interest in fieldwork and controls."
    stances: [Important problems lie out in the field]
    crossouts: []
    items:
      - label: Space Robotics
        date: 2019.5
        images:
          - src: /images/story/ranger-duck.jpg
          - src: /images/story/ranger-asteroid.jpg
      - label: Autonomous Tunneling
        date: 2021.6
        images:
          - src: /images/story/notaboring.jpg

  # Into graduate school.
  - reach: 2022.4
    text: "As I learned about data-driven engineering, I realized how far practice was from methods. Engineers were right to be reluctant about learned systems, yet wrong not to take the risk."
    stances: ["Data is the future"]
    crossouts: []
    items:
      - label: NRL
        date: 2022.0
        images:
          - src: /images/story/nrl-koopman.png
            fit: contain

  - reach: 2023.6
    text: "Starting my PhD, I dove in with a <u>decked out</u> high-speed, off-road robot (4 GPUs + 3 LiDARs + 4 RGB-D ... and a Chlorophyll camera? all while 30+ mph)."
    stances: ["Perception, planning, and control can take you really far"]
    crossouts: []
    items:
      # Keep the bottom-right corner: it carries the public-release statement.
      - label: RACER
        date: 2022.9
        size: 1.3
        images:
          - src: /images/story/chase-crater.jpg
            pos: right bottom
          - src: /images/story/downhill.jpg
            pos: right bottom
          - src: /images/story/axle_repair.jpg
            pos: right bottom

  - reach: 2024.6
    text: "All the standard control and systems engineering issues persisted, now with a bit of ML-flavoring. <u>The world is too big to not expect failure.</u>"
    stances: ["Robots should continually learn: from humans and end-to-end"]
    edits: [
      {stance: 1, word: "the field", write: "deployment"},
    ]
    items:
      # Keep the bottom-right corner: it carries the public-release statement.
      - label: R:SS 2024
        date: 2023.9
        size: 1.3
        images:
          - src: /images/story/racer-ditch.jpg
            pos: right bottom
          - src: /images/story/racer-rollover.jpg
            pos: right bottom

  - reach: 2025.3
    text: "Sim2Real felt like modern-day control engineering. Not so much learning. But, if I were to build a company right now, it would be around simulation. <u>New roboticists need to be ready for this.</u>"
    edits: [
      {stance: 2, word: "Data", write: "Simulation"},
      # {stance: 4, after: "end-to-end", write: "with Reinforcement Learning"}
      ]
    revives: [{stance: 3, word: "control"}, {stance: 3, word: "can take you really far"}]
    crossouts: [3]
    items:
      - label: Wheeled Lab
        date: 2025.1
        images:
          - src: /images/story/wheeled-lab-fig1.jpg
          - src: /images/story/wl-lab-clip.mp4
          - src: /images/story/wl-drift.mp4
            fit: contain
      - label: WL@UW
        date: 2025.4
        aspect: 1.5
        images:
          - src: /images/story/wheeled-lab-education.jpg
            caption: '<span>An open <a href="https://uwrobotlearning.github.io/WheeledLab/overview.html">course</a>, the <a href="https://uwrobotlearning.github.io/WheeledLab/wlatuw.html">WL@UW</a> student program, and <a href="https://www.youtube.com/watch?v=caVh-2v4xz4">videos</a></span>'

    # stances: ["Roboticists are merely moving their problems around; If a problem has to exist, where should it be?"]

  - reach: 2026.1
    text: "Over a year of trying to reconcile control with learning, I pushed on planning-based Inverse RL as a means to learn and execute intent. Simulation stood in the way."
    stances: []
    edits: [
      {stance: 4, after: ":", write: "intent"},
      # {stance: 4, after: "with", write: "Inverse"},
      {stance: 2, word: "Simulation", write: "Experience"},
      {stance: 3, word: "control"}
    ]
    revives: [
      {stance: 3, word: "planning"},
      # {stance: 3, word: "can take you really far"}
    ]
    crossouts: []
    items:
      - label: MPAIL
        date: 2025.6
        images:
          - src: /images/story/mpail-fig1.jpg
            fit: contain
          - src: /images/story/mpail-real.mp4
            fit: contain

  - reach: 2026.7
    text: "Finally, I'm seeing a way forward for robots to adapt during deployment without extensive engineering. Can I scale this up?"
    stances: []
    crossouts: []
    edits: [
      {stance: 4, word: "from", write: "by observing"},
    ]
    items:
      - label: MPAIL2
        date: 2026.15
        images:
          - src: /images/story/mpail2-fig.jpg
          - src: /images/story/mpail2-vis.mp4
            fit: contain
