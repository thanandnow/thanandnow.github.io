- project: "WL @ UW"
  role: "University of Washington, February 2025 - present"
  image: /images/story/wheeled-lab-education.jpg
  stars: UWRobotLearning/WheeledLab
  description: |
    Created an open-source education platform and content for students new to reinforcement
    learning in robotics, and advise undergraduate teams beginning in robotics by
    mentoring extracurricular Sim2Real projects. Student organization under development.
    <br><br>
    If you're interested in RL and robotics but don't know where to start, consider starting with us!
    Students begin with self-driven Sim2Real projects spanning pre-trained encoders, Real2Sim, depth-based Sim2Real, high-performance visual racing, and more.
  links:
    - title: student org
      url: https://uwrobotlearning.github.io/WheeledLab/wlatuw.html